<div class="pure-menu custom-restricted-width pure-u-1-1">
    <ul class="pure-menu-list">
        @for (menuitem of menuitems; track menuitem) {
            <li class="pure-menu-item">
                <button class="pure-button pure-menu-link" (click)="routeToPage(menuitem)">{{menuitem}}</button>
            </li>
        }
    </ul>
</div>
