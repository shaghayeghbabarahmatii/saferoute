<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="Logo.jpg" alt="SafeRoute Logo" class="auth-logo" />
      <h1>SafeRoute</h1>
      <p>{{ isLogin ? 'Sign in to your account' : 'Create a new account' }}</p>
    </div>

    @if (!isLogin) {
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" placeholder="Your name" />
      </div>
    }

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="you@email.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    @if (errorMsg) {
      <p class="error">{{ errorMsg }}</p>
    }

    <button class="btn-primary" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Please wait...' : (isLogin ? 'Sign In' : 'Register') }}
    </button>

    <p class="toggle-text">
      {{ isLogin ? "Don't have an account?" : "Already have an account?" }}
      <span (click)="toggleMode()">{{ isLogin ? 'Register' : 'Sign In' }}</span>
    </p>
  </div>
</div>
